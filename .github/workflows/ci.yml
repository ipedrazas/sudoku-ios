name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job drives Taskfile.yml rather than calling swift/xcodebuild directly, so
# CI and a developer's machine run the same commands. That matters more than
# usual here: the toolchain flags differ between a full-Xcode install and a
# Command Line Tools one, and the Taskfile is where that difference is resolved.
jobs:
  # The fast gate, covering the part of the codebase where bugs are expensive:
  # the technique rater and the solver. Needs no Xcode project and no simulator.
  kit:
    name: SudokuKit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Task and linters
        run: brew install go-task swiftlint swift-format

      - name: Show toolchain
        run: task install

      - name: Build
        run: task build:kit

      - name: Test with coverage (>= 90%)
        run: task test:kit:cover

      - name: SwiftLint
        run: task lint

      - name: swift-format
        run: task format:check

  # Generation must stay fast. A refactor that triples carve cost should fail the
  # build, not ship. Budgets live in PerformanceTests.swift.
  bench:
    name: Generation budgets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Task
        run: brew install go-task
      - name: Run performance harness
        run: task bench

  # From Phase 3 onward. iPad is not optional — it ships in v1, so it gets a
  # destination of its own rather than an assumption that compact width covers it.
  app:
    name: App (${{ matrix.family }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # Family, not a device name: the runner's simulator line-up changes
        # with every Xcode release, and pinning a model failed the build before
        # it compiled anything.
        family: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4

      # `hashFiles` is not available in a job-level `if` — that expression is
      # evaluated before the workspace exists. Probing after checkout is both
      # valid and clearer: it says in the log why the job did nothing.
      - name: Does the app target have sources yet?
        id: probe
        run: |
          if find SudokuApp/Sources -name '*.swift' -print -quit 2>/dev/null | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "SudokuApp has no Swift sources yet — Phase 3 has not started. Nothing to build."
          fi

      - name: Install Task and XcodeGen
        if: steps.probe.outputs.exists == 'true'
        run: brew install go-task xcodegen

      - name: Generate project
        if: steps.probe.outputs.exists == 'true'
        run: task xcodegen

      # Cheap, and catches the one class of localization bug a passing build
      # cannot: a string that is looked up at run time and translated nowhere.
      # It runs before the tests because it takes seconds and they take minutes.
      - name: Localization
        if: steps.probe.outputs.exists == 'true' && matrix.family == 'iphone'
        run: task localization

      - name: Test
        if: steps.probe.outputs.exists == 'true'
        run: |
          xcodebuild test \
            -project SudokuApp/SudokuApp.xcodeproj \
            -scheme SudokuApp \
            -destination "$(./scripts/simulator-destination.sh ${{ matrix.family }})" \
            CODE_SIGNING_ALLOWED=NO
