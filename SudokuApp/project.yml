name: SudokuApp

# The .xcodeproj is generated, never committed: a hand-maintained .pbxproj is a
# merge-conflict generator and makes CI reproducibility worse. `task xcodegen`
# regenerates it; CI regenerates before every build.
#
# Targets are added as the phases that need them land. XcodeGen refuses a spec
# whose source directories are missing, so declaring a widget target before
# Phase 8 writes one would break every build in the meantime. The widget target,
# the App Group entitlement and the associated-domain entitlement arrive with
# the features that need them (Phases 7 and 8) — the decisions behind them are
# settled and recorded in §12 of the plan.

options:
  bundleIdPrefix: dev.andcake
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  SudokuKit:
    path: ".."

targets:
  SudokuApp:
    type: application
    platform: iOS
    # Universal from day one: adaptive layout is cheap to design in and
    # expensive to retrofit. See §8 of plans/implementation-plan.md.
    deviceFamily: [1, 2]
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: SudokuKit
        product: SudokuKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.andcake.sudoku
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        # Two puzzles side by side on iPad. Cheap, because GameSession is
        # per-scene state and never a global singleton.
        INFOPLIST_KEY_UIRequiresFullScreen: false
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Sudoku and Cake
        ITSAppUsesNonExemptEncryption: false

  SudokuAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/SudokuAppTests]
    dependencies:
      - target: SudokuApp
      - package: SudokuKit
        product: SudokuKit

  SudokuAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/SudokuAppUITests]
    dependencies:
      - target: SudokuApp

schemes:
  SudokuApp:
    build:
      targets:
        SudokuApp: all
    test:
      targets:
        - SudokuAppTests
        - SudokuAppUITests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
