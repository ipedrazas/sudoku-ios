version: "3"

vars:
  # SwiftPM sandboxes manifest evaluation with sandbox-exec, which cannot nest
  # inside an outer sandbox (nono). Disabling SwiftPM's own sandbox is safe: it
  # only governs manifest/plugin execution, and this package has neither
  # dependencies nor build plugins.
  SWIFT_FLAGS: "--disable-sandbox"
  # Swift Testing ships with the Command Line Tools but SwiftPM does not wire up
  # its search paths when full Xcode is absent, so `import Testing` fails to
  # compile and then fails to load. These flags supply the framework path and the
  # two rpaths it needs. They resolve to nothing once Xcode is installed, which
  # is also why they are computed rather than hard-coded.
  CLT_FRAMEWORKS:
    sh: 'test -d /Library/Developer/CommandLineTools/Library/Developer/Frameworks && ! xcodebuild -version >/dev/null 2>&1 && echo /Library/Developer/CommandLineTools/Library/Developer/Frameworks || true'
  CLT_INTEROP: /Library/Developer/CommandLineTools/Library/Developer/usr/lib
  TEST_FLAGS: '{{if .CLT_FRAMEWORKS}}-Xswiftc -F -Xswiftc {{.CLT_FRAMEWORKS}} -Xlinker -rpath -Xlinker {{.CLT_FRAMEWORKS}} -Xlinker -rpath -Xlinker {{.CLT_INTEROP}}{{end}}'
  # Only the trees that exist: SudokuWidgets arrives in Phase 8, and passing a
  # missing path to swift-format currently happens to be harmless rather than
  # guaranteed to be.
  SOURCE_DIRS:
    sh: 'for d in SudokuKit SudokuApp SudokuWidgets; do if [ -d "$d" ]; then printf "%s " "$d"; fi; done'
  KIT_DIR: SudokuKit
  APP_DIR: SudokuApp
  SCHEME: SudokuApp
  # Destinations are resolved at run time by scripts/simulator-destination.sh.
  # Hardcoding device names does not survive an Xcode release: "iPhone 16" and
  # "iPad Pro 11-inch (M4)" both vanished from the CI runner and failed the
  # build before it compiled anything.
  # The web repo's generator package, source of the cross-check fixture.
  WEB_REPO: "../sudoku-and-cake"
  # App tasks need two things, not one: full Xcode *and* an app target that has
  # sources. See scripts/skip-app-tasks.sh for why this is a script rather than
  # an inline condition. A zero exit means "up to date", so the task is skipped.
  SKIP_APP: ./scripts/skip-app-tasks.sh
  # Simulator builds are unsigned. `CODE_SIGNING_ALLOWED=NO` alone was enough
  # until Phase 8: the App Group entitlement is a *provisioned capability*, and
  # automatic signing on a machine with no profile for it is a build failure
  # about provisioning rather than about anything in the code. The other two
  # settings say "there is no identity and none is required" outright. The
  # entitlement is simply not applied, which is why every read of the shared
  # container degrades to "no snapshot" instead of trapping.
  NO_SIGNING: 'CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""'

tasks:
  default:
    cmds:
      - task --list

  install:
    desc: Resolve Swift package dependencies and check the toolchain
    cmds:
      - swift --version
      - swift package resolve {{.SWIFT_FLAGS}}
      - cmd: |
          if ! xcodebuild -version >/dev/null 2>&1; then
            echo ""
            echo "  NOTE: full Xcode is not installed (Command Line Tools only)."
            echo "  SudokuKit builds and tests fine without it — 'task test:kit'."
            echo "  App and widget targets need Xcode; install it before P2-8."
            echo ""
          fi
        ignore_error: true

  build:
    desc: Build SudokuKit and, if Xcode is present, the app
    cmds:
      - task: build:kit
      - task: build:app

  build:kit:
    desc: Build SudokuKit (no Xcode required)
    cmds:
      - swift build {{.SWIFT_FLAGS}} -c release

  build:app:
    desc: Build the iOS app (requires full Xcode and an app target)
    deps: [xcodegen]
    status:
      - '{{.SKIP_APP}}' 
    cmds:
      - xcodebuild build -project {{.APP_DIR}}/{{.SCHEME}}.xcodeproj -scheme {{.SCHEME}} -destination "$(./scripts/simulator-destination.sh iphone)" {{.NO_SIGNING}}

  test:
    desc: Run all tests
    cmds:
      - task: test:kit
      - task: test:app

  test:kit:
    desc: Run SudokuKit tests (no Xcode required)
    cmds:
      - swift test {{.SWIFT_FLAGS}} {{.TEST_FLAGS}}

  test:kit:cover:
    desc: Run SudokuKit tests with coverage; SudokuKit must be at least 90%
    cmds:
      - swift test {{.SWIFT_FLAGS}} {{.TEST_FLAGS}} --enable-code-coverage
      - ./scripts/coverage-gate.sh 90 "$(swift test {{.SWIFT_FLAGS}} --show-codecov-path | tail -1)"

  test:app:
    desc: Run app tests on iPhone and iPad simulators (requires full Xcode and an app target)
    deps: [xcodegen]
    status:
      - '{{.SKIP_APP}}' 
    cmds:
      - xcodebuild test -project {{.APP_DIR}}/{{.SCHEME}}.xcodeproj -scheme {{.SCHEME}} -destination "$(./scripts/simulator-destination.sh iphone)" {{.NO_SIGNING}}
      - xcodebuild test -project {{.APP_DIR}}/{{.SCHEME}}.xcodeproj -scheme {{.SCHEME}} -destination "$(./scripts/simulator-destination.sh ipad)" {{.NO_SIGNING}}

  bench:
    desc: Run the generation performance harness (Gate G1) and print the distribution
    env:
      SUDOKU_BENCH: "1"
    cmds:
      - swift test {{.SWIFT_FLAGS}} {{.TEST_FLAGS}} -c release --filter PerformanceTests

  # Release tasks deliberately have no `status: SKIP_APP` guard. Every other app
  # task skips itself when Xcode is absent, which is right for a developer
  # machine that only builds the kit — but a release that silently does nothing
  # and exits 0 is the worst possible outcome, so these fail instead.
  #
  # See plans/releasing.md; both need a real shell, not the nono sandbox.
  archive:
    desc: Build a signed Release archive for the App Store (requires Xcode and a distribution certificate)
    deps: [xcodegen]
    cmds:
      # No CODE_SIGNING_ALLOWED=NO here, unlike every simulator task above:
      # an unsigned archive cannot be uploaded.
      - xcodebuild archive -project {{.APP_DIR}}/{{.SCHEME}}.xcodeproj -scheme {{.SCHEME}} -configuration Release -destination 'generic/platform=iOS' -archivePath build/{{.SCHEME}}.xcarchive -allowProvisioningUpdates
      - ./scripts/verify-archive.sh build/{{.SCHEME}}.xcarchive

  export:
    desc: Export an uploadable .ipa from the archive
    cmds:
      - xcodebuild -exportArchive -archivePath build/{{.SCHEME}}.xcarchive -exportPath build/export -exportOptionsPlist {{.APP_DIR}}/ExportOptions.plist -allowProvisioningUpdates
      # The same checks again, on the artefact that actually gets uploaded. Not
      # redundant: export re-signs everything, so this is the first and only
      # point at which the distribution certificate can be confirmed.
      - ./scripts/verify-archive.sh build/export/{{.SCHEME}}.ipa
      - echo "Wrote build/export — see plans/releasing.md §6 to upload."

  typecheck:
    desc: Type-check app and widget sources against the simulator SDK (no Xcode build needed)
    cmds:
      - ./scripts/typecheck.sh

  localization:
    desc: Check every localizable string is translated in every language the app ships
    cmds:
      - ./scripts/check-localization.py

  sounds:
    desc: Regenerate the sound effects into SudokuApp/Resources/Sounds
    cmds:
      - swift scripts/make-sounds.swift

  icon:
    desc: Regenerate the app icon
    cmds:
      - swift scripts/make-icon.swift

  lint:
    desc: Lint Swift sources
    env:
      # SwiftLint loads sourcekitd, which lives inside Xcode when it is
      # installed and inside the Command Line Tools when it is not. Pointing the
      # dynamic loader at the CLT copy makes linting work in both cases.
      DYLD_FRAMEWORK_PATH: /Library/Developer/CommandLineTools/usr/lib
    cmds:
      - swiftlint --strict

  format:
    desc: Format Swift sources in place
    cmds:
      - swift-format format --in-place --recursive --configuration .swift-format {{.SOURCE_DIRS}}

  format:check:
    desc: Check formatting without writing
    cmds:
      - swift-format lint --recursive --strict --configuration .swift-format {{.SOURCE_DIRS}}

  xcodegen:
    desc: Regenerate the Xcode project from project.yml
    status:
      - '{{.SKIP_APP}}'
    cmds:
      - xcodegen generate --spec {{.APP_DIR}}/project.yml --project {{.APP_DIR}}

  run:
    desc: Build and run the app in the iPhone simulator (requires full Xcode and an app target)
    deps: [build:app]
    cmds:
      - ./scripts/run-simulator.sh

  fixtures:
    desc: Regenerate the Go-to-Swift cross-check fixture from the web repo's generator
    dir: tools/export-fixtures
    env:
      # The tool reaches the web repo through a local `replace`, so nothing needs
      # downloading. GOPROXY=off makes that explicit and keeps the build offline
      # rather than stalling on module resolution.
      GOPROXY: "off"
      GOFLAGS: "-mod=mod"
    cmds:
      - go run . -out ../../{{.KIT_DIR}}/Tests/SudokuKitTests/Fixtures/tier-corpus.json
      - echo "Fixture regenerated. Re-run 'task test:kit' to verify the port still agrees."

  clean:
    desc: Remove build artefacts
    cmds:
      - rm -rf .build
      - rm -rf {{.APP_DIR}}/{{.SCHEME}}.xcodeproj
